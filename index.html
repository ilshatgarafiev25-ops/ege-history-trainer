async function fetchBank() {

  const PAGE_SIZE = 1000;
  let allRows = [];
  let from = 0;
  while (true) {
    const { data, error } = await sb.from("questions").select("*").order("created_at", { ascending: true }).range(from, from + PAGE_SIZE - 1);
    if (error) {
      console.error(error);
      return { data: allRows.map(rowToQuestion), error };
    }
    allRows = allRows.concat(data);
    if (!data || data.length < PAGE_SIZE) break;

function constructorRead(key, fallback) {

function constructorTopics(q) {
  const m=q.metadata||{};
  const raw=[...(q.requiredCourseTopics||[]),...(m.requiredCourseTopics||[]),...(q.mentionedCourseTopics||[]),...(m.mentionedCourseTopics||[])];
  // Invalid topic labels fail closed, rather than silently narrowing the scope.
  if(raw.some(t=>!course38Normalize(t))) return [];
  return [...new Set([...course38RequiredIds(q),...raw.map(course38Normalize).filter(Boolean).map(t=>t.id)])].sort((a,b)=>a-b);

// === TASK 16 GENERATOR v1 ===
function task16Validate(data){
  const rows=Array.isArray(data)?data:[];
  if(!rows.length)throw new Error('В history_task_16_questions.json нет заданий.');
  const seen=new Set();
  rows.forEach((q,i)=>{
    if(q==null||q.id==null)throw new Error('У задания №16 #'+(i+1)+' нет id.');
    if(seen.has(String(q.id)))throw new Error('Дубль id №16: '+q.id);
    seen.add(String(q.id));
    const imgs=Array.isArray(q.local_image_paths)?q.local_image_paths.filter(Boolean):[];
    if(imgs.length!==1)throw new Error('У задания №16 id '+q.id+' должно быть ровно 1 изображение.');
    if(!(q.question_text||'').trim())throw new Error('У задания №16 id '+q.id+' нет текста вопроса.');
    const tid=Number(q.courseTopicId);
    if(!Number.isInteger(tid)||tid<1||tid>38||!COURSE38_BY_ID.has(tid))throw new Error('У задания №16 id '+q.id+' нет корректной темы курса.');
  });
  return rows;
}

function Task16Tab({onReload,constructorScope}){
  const h=React.createElement;
  const [rows,setRows]=useState([]);
  const [selected,setSelected]=useState([]);
  const [search,setSearch]=useState('');
  const [count,setCount]=useState('10');
  const [questions,setQuestions]=useState([]);
  const [name,setName]=useState('');
  const [training,setTraining]=useState(true);
  const [created,setCreated]=useState(null);
  const [saved,setSaved]=useState(new Set());
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState('');
  const [status,setStatus]=useState('Загружаю базу №16…');

  useEffect(()=>{
    let live=true;
    (async()=>{
      try{
        const r=await fetch('history_task_16_questions.json',{cache:'no-store'});
        if(!r.ok)throw new Error('Положите history_task_16_questions.json рядом с index.html.');
        const data=task16Validate(await r.json());
        if(live){
          setRows(data);
          setSelected(data.map(q=>String(q.id)));
          setStatus('База №16: '+data.length+' заданий · у каждого ровно 1 изображение.');
        }
      }catch(e){
        if(live)setError(e.message);
      }
    })();
    return()=>{live=false;};
  },[]);

  const through=Math.max(1,Math.min(38,Number(constructorScope?.through||38)));
  const mode=constructorScope?.mode==='current'?'current':'cumulative';
  const eligible=rows.filter(q=>mode==='current'?Number(q.courseTopicId)===through:Number(q.courseTopicId)<=through);
  const needle=search.trim().toLocaleLowerCase('ru');
  const visible=eligible.filter(q=>{
    if(!needle)return true;
    return ((q.question_text||'')+' '+(q.solution_text||'')+' '+q.id+' '+(q.theme_id||'')+' '+(q.courseTopicName||''))
      .toLocaleLowerCase('ru').includes(needle);
  });
  const chosen=eligible.filter(q=>selected.includes(String(q.id)));
  const groups=COURSE38_TOPICS.map(t=>({topic:t,rows:visible.filter(q=>Number(q.courseTopicId)===Number(t.id))})).filter(g=>g.rows.length);
  const modeText=mode==='current'?'только тема '+through:'накопительно: темы 1–'+through;

  function mark(ids,yes){
    const sids=ids.map(String);
    setSelected(prev=>yes?[...new Set([...prev,...sids])]:prev.filter(id=>!sids.includes(id)));
  }

  function generate(index){
    setError('');
    setCreated(null);
    try{
      if(index===undefined){
        const n=Number(count);
        if(!Number.isInteger(n)||n<1||n>100)throw new Error('Количество заданий — от 1 до 100.');
        if(chosen.length<n)throw new Error('Выбрано '+chosen.length+' заданий, а нужно '+n+'.');
        const picked=atomicShuffle(chosen).slice(0,n);
        setQuestions(picked.map(task16Question));
        setSaved(new Set());
        setStatus('Сгенерировано заданий №16: '+n+'.');
      }else{
        if(!chosen.length)throw new Error('Нет выбранных заданий для замены.');
        const used=new Set(questions.filter((_,i)=>i!==index).map(q=>String(q.sourceId)));
        const candidates=atomicShuffle(chosen).filter(q=>!used.has(String(q.id)));
        if(!candidates.length)throw new Error('Нет другого выбранного задания для замены.');
        setQuestions(prev=>prev.map((q,i)=>i===index?task16Question(candidates[0]):q));
      }
    }catch(e){
      setError(e.message);
    }
  }

  async function save(makeTest){
    if(busy||!questions.length)return;
    if(makeTest&&!name.trim()){
      setError('Введите название теста.');
      return;
    }
    setBusy(true);
    setError('');
    const done=new Set(saved);
    try{
      for(const q of questions){
        if(done.has(q.id))continue;
        const err=await upsertQuestion(q);
        if(err)throw err;
        done.add(q.id);
        setSaved(new Set(done));
      }
      if(makeTest){
        const t={
          id:uid('t'),
          code:genCode(),
          name:name.trim(),
          training,
          questionIds:questions.map(q=>q.id)
        };
        const err=await insertTest(t);
        if(err)throw err;
        setCreated(t);
      }
      setStatus('Сохранено заданий №16: '+questions.length+'.');
      await onReload();
    }catch(e){
      setError('Сохранение: '+portalError(e));
    }finally{
      setBusy(false);
    }
  }

  return h('fieldset',{
      'data-task':16,
      className:'atomic-generator',
      disabled:busy,
      style:{border:0,padding:0,margin:0,minWidth:0}
    },
    h('div',{className:'card'},
      h('h2',null,'Генератор №16'),
      h('div',{className:'notice',role:'status'},status),
      error&&h('div',{className:'notice',role:'alert'},error),

      h('p',null,'Используется только отдельная база задания №16. №15 и №17 этот генератор не затрагивает. Каждая карточка содержит ровно одно изображение.'),
      h('div',{className:'notice'},'Разбивка выполнена по нашим 38 темам. Сейчас используется настройка конструктора: ',h('strong',null,modeText),'.'),

      h('label',null,'Поиск по вопросу, ответу или ID'),
      h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'Репин, архитектура, 95591…'}),

      h('div',{className:'atomic-actions'},
        h('button',{className:'btn ghost small',onClick:()=>mark(visible.map(q=>q.id),true)},'Выбрать все показанные'),
        h('button',{className:'btn ghost small',onClick:()=>mark(visible.map(q=>q.id),false)},'Снять показанные')
      ),
      h('p',{className:'q-meta'},'Доступно по выбранным темам: '+eligible.length+' · показано: '+visible.length+' · выбрано: '+chosen.length+' из 113.'),

      groups.map(g=>h('details',{key:g.topic.id,'data-topic':g.topic.id,open:g.rows.length<=5},
        h('summary',null,'Тема '+g.topic.id+'. '+g.topic.name+' — '+g.rows.length+' заданий'),
        h('div',{className:'atomic-actions'},
          h('button',{className:'btn ghost small',onClick:()=>mark(g.rows.map(q=>q.id),true)},'Выбрать тему'),
          h('button',{className:'btn ghost small',onClick:()=>mark(g.rows.map(q=>q.id),false)},'Снять тему')
        ),
        g.rows.map(raw=>{
          const image=(raw.local_image_paths||[])[0]||'';
          return h('details',{className:'q-list-item',key:raw.id},
            h('summary',null,
              h('label',{className:'opt',onClick:e=>e.stopPropagation()},
                h('input',{
                  type:'checkbox',
                  checked:selected.includes(String(raw.id)),
                  onChange:e=>mark([raw.id],e.target.checked)
                }),
                'ID '+raw.id+' · '+(raw.question_text||'').slice(0,120)
              )
            ),
            h('p',{className:'q-meta'},'Тема '+raw.courseTopicId+'. '+raw.courseTopicName),
            image&&h('img',{src:imageUrl(image),className:'q-image',alt:'Изображение задания №16'}),
            h('p',null,raw.question_text||''),
            h('details',null,
              h('summary',null,'Ответ и разбор'),
              h('p',null,raw.solution_text||'Разбор отсутствует.')
            )
          );
        })
      )),

      h('label',null,'Количество заданий (1–100, не больше выбранных)'),
      h('input',{type:'number',min:1,max:100,value:count,onChange:e=>setCount(e.target.value)}),
      h('button',{
        className:'btn',
        disabled:busy||!chosen.length,
        onClick:()=>generate()
      },'Сгенерировать задания №16')
    ),

    questions.length>0&&h('div',{className:'card'},
      h('h2',null,'Предпросмотр: '+questions.length),
      h('label',null,'Название теста'),
      h('input',{value:name,onChange:e=>{setName(e.target.value);setCreated(null);},placeholder:'№16 — культура'}),
      h('label',{className:'opt'},
        h('input',{type:'checkbox',checked:training,onChange:e=>setTraining(e.target.checked)}),
        'Тренировочный режим'
      ),
      h('div',{className:'atomic-actions'},
        h('button',{className:'btn ghost',disabled:busy,onClick:()=>save(false)},'Сохранить в банк'),
        h('button',{className:'btn',disabled:busy||!!created,onClick:()=>save(true)},'Сохранить и создать тест')
      ),
      created&&h('div',{className:'notice'},
        'Код теста: ',h('strong',null,created.code),' ',
        h('a',{href:constructorLink(created.code),target:'_blank',rel:'noopener noreferrer'},constructorLink(created.code))
      ),
      questions.map((q,i)=>h('div',{className:'q-list-item',key:q.id},
        h('h3',null,'Задание '+(i+1)+' · №16'),
        h(ConstructorPreview,{q}),
        h('div',{className:'atomic-actions'},
          h('button',{className:'btn ghost small',onClick:()=>generate(i)},'Заменить'),
          h('button',{className:'btn danger',onClick:()=>{setQuestions(prev=>prev.filter((_,j)=>j!==i));setCreated(null);}},'Удалить')
        )
      ))
    )
  );
}

function task18Validate(data){
  const rows=Array.isArray(data)?data:[];
  if(rows.length!==62)throw new Error('Ожидалось 62 задания №18, получено '+rows.length+'.');
  const seen=new Set();
  rows.forEach((q,i)=>{
    if(q==null||q.id==null)throw new Error('У задания №18 #'+(i+1)+' нет id.');
    if(seen.has(String(q.id)))throw new Error('Дубль id №18: '+q.id);
    seen.add(String(q.id));
    if(!(q.question_text||'').trim())throw new Error('У задания №18 id '+q.id+' нет текста.');

    if(Number(q.courseTopicId)!==30)throw new Error('У задания №18 id '+q.id+' неверная тема.');
  });
  return rows;
}

// MAP912_TOPIC38_V3
function map912Validate(data){
  if(!data||!Array.isArray(data.blocks)||data.blocks.length!==123)throw new Error('Ожидалось ровно 123 блока карт №9–12.');
  const ids=new Set(),paths=new Set();
  return data.blocks.map((b,i)=>{
    const tid=Number(b.courseTopicId);
    if(!b||typeof b.blockId!=='string'||ids.has(b.blockId)||!b.imagePath||paths.has(b.imagePath)||!b.mapTitle||!Number.isInteger(tid)||tid<1||tid>38)throw new Error('Некорректный блок карты '+(i+1)+'.');
    const topic=COURSE38_BY_ID.get(tid);
    if(!topic)throw new Error('У '+b.blockId+' неизвестная тема '+tid+'.');
    for(const n of ['9','10','11','12']){const q=b.questions&&b.questions[n];if(!q||!q.questionText||!Array.isArray(q.answers)||!q.answers.length)throw new Error('В '+b.blockId+' нет полного задания №'+n+'.');}
    ids.add(b.blockId);paths.add(b.imagePath);return {...b,courseTopicId:tid,courseTopicName:b.courseTopicName||topic.name,enabled:b.enabled!==false};
  });
